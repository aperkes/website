################################## About #####################################
about:
  enable : true
  image : "images/portraits/ammon_pink_gloves.jpg"
  title : "I like watching animals. I love making computers watch them for me."
  content : "My name is Ammon (it rhymes with backgammon, or examine). 
  I started college to be a math major, but I realized that just being moderately 
  good at something wasn't the same as wanting to spend my life doing it. Fortunately, around the same time I found out that I could use a lot of the same skills to study animal behavior. 

  I had the great fortune of spending my PhD learning how to use computer vision 
  to quantify behavior and study courtship in 3D. These days, I’m leveraging those 
  same skills to study the development of individual and group-level personalities. 

  I love figuring out how to tackle complex tracking problems, and teach others
  how to apply computer vision to answer cool questions about their systems. 

  If you want to collaborate, or just chat, drop me a line!


  "
  button:
    enable : True
    label : "Check out my CV"
    link : "perkes_online_cv.pdf"

